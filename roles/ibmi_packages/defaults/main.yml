---
# Default variables for ibmi_packages role

# YUM binary location
yum_binary: "/QOpenSys/pkgs/bin/yum"

# Required packages list
# Note: python39 is installed in Phase 0 (Pre-Bootstrap) using raw commands
# Note: python39-pip must be installed before python39-itoolkit
required_packages:
  - python39-itoolkit
  - git
  - tn5250
  - service-commander
  - mapepire-server
  - rsync
  - ibmichroot
  - nano
  - tobi

  
# Package installation retry settings
package_retry_count: 2
package_retry_delay: 5

# Whether to update cache before installation
update_cache: true

# Whether to log package installations
log_installations: true

