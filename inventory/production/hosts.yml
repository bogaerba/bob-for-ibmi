# Production IBM i Inventory
# 
# This file defines the IBM i systems in your production environment.
# Update the hostnames, IP addresses, and connection details to match your infrastructure.

all:
  children:
    ibmi_servers:
      hosts:
        # Example IBM i Production Server 1
        161.156.136.101:
          ansible_host: 161.156.136.101
          ansible_user: U23SFPH
          ansible_ssh_private_key_file: ~/.ssh/161.156.136.101.pem
          
          # IBM i specific connection settings
          ansible_shell_type: sh
          ansible_shell_executable: /QOpenSys/pkgs/bin/bash
          
          # Python interpreter - Two-Phase Bootstrap Approach
          # Default to system Python for initial setup (allows Python 3.9 installation)
          # The site.yml playbook overrides this in Phase 2 to use Python 3.9
          # after it has been installed in Phase 1
          ansible_python_interpreter: /QOpenSys/pkgs/bin/python3
          
          # Host-specific variables (optional)
          ibmi_system_name: PRODIBM01
          ibmi_environment: production

        p231240-pvs1:
