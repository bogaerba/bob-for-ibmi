[defaults]
# Inventory
inventory = inventory/production/hosts.yml
host_key_checking = False

# Output
stdout_callback = yaml
bin_ansible_callbacks = True

# Performance
forks = 5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# SSH
timeout = 30
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Logging
log_path = /tmp/ansible-ibmi.log

# Roles
roles_path = roles

# Python Interpreter - Two-Phase Bootstrap Approach
# Default to system Python (/QOpenSys/pkgs/bin/python3) for initial setup
# This allows the playbook to install Python 3.9 before using it
#
# The site.yml playbook overrides this in two phases:
#   Phase 1: Uses /QOpenSys/pkgs/bin/python3 (system Python) to install Python 3.9
#   Phase 2: Uses /QOpenSys/pkgs/bin/python3.9 for remaining configuration tasks
#
# This prevents "SyntaxError: future feature annotations is not defined" errors
# that occur when trying to use Python 3.9 before it's installed
interpreter_python = /QOpenSys/pkgs/bin/python3

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

